<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <title>Thai League Checklist</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #18181f;
            --surface3: #1e1e28;
            --border: #2a2a38;
            --border-bright: #3a3a50;
            --accent: #7c6ff7;
            --accent-dim: #5a55c8;
            --accent-glow: rgba(124, 111, 247, 0.18);
            --accent2: #a78bfa;
            --green: #34d399;
            --red: #f87171;
            --amber: #fbbf24;
            --text: #e8e8f0;
            --text-muted: #6b6b85;
            --text-dim: #9898b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        input, button, textarea { -webkit-user-select: text; user-select: text; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 0 0 1px rgba(124,111,247,0.08), 0 24px 64px rgba(0,0,0,0.6);
            max-width: 620px;
            width: 100%;
            padding: 32px;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .trophy { font-size: 2.2em; margin-bottom: 10px; filter: drop-shadow(0 0 12px rgba(124,111,247,0.5)); }
        h1 {
            color: var(--text);
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
        }
        .match-info { color: var(--text-dim); font-size: 0.9em; line-height: 1.8; }

        .editable-field { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
        .editable-field input {
            padding: 7px 12px;
            background: var(--surface3);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-size: 0.9em;
            color: var(--text);
            width: auto;
            max-width: 100%;
            outline: none;
        }
        .editable-field input:focus { box-shadow: 0 0 0 3px var(--accent-glow); }
        .editable-field button {
            padding: 7px 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: background 0.2s;
        }
        .editable-field button:hover { background: var(--accent-dim); }
        .display-field {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
            color: var(--text-dim);
        }
        .display-field:hover { background: var(--surface3); color: var(--text); }

        /* Header bilingual spans */
        .header [data-lang="th"] { display: none; }
        .header [data-lang="en"] { display: inline; }
        body.lang-th .header [data-lang="en"] { display: none; }
        body.lang-th .header [data-lang="th"] { display: inline; }

        /* ── Progress ── */
        .checklist { margin-bottom: 28px; }
        .progress-section { margin-bottom: 20px; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.75em; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
        .progress-label span:last-child { color: var(--accent2); font-weight: 600; }
        .progress-bar { width: 100%; height: 4px; background: var(--surface3); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width 0.4s cubic-bezier(.4,0,.2,1); border-radius: 10px; box-shadow: 0 0 8px var(--accent-glow); }

        /* ── Section title ── */
        .section-title {
            color: var(--text-muted);
            font-weight: 600;
            margin: 0 0 14px 0;
            font-size: 0.75em;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* ── Uncheck button row ── */
        .uncheck-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }

        /* ── Checklist Items ── */
        .checklist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 14px;
            margin-bottom: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            position: relative;
            width: 100%;
        }
        .checklist-item:hover { border-color: var(--border-bright); background: var(--surface3); }

        .drag-handle {
            flex: 0 0 auto;
            color: var(--border-bright);
            padding: 4px 10px 4px 0;
            cursor: move;
            font-size: 1.1em;
            line-height: 1;
            touch-action: none;
            transition: color 0.15s;
        }
        .drag-handle:hover { color: var(--text-muted); }

        .checklist-item input[type="checkbox"] {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
            margin-right: 12px;
            border-radius: 4px;
        }

        .checklist-item label {
            flex: 1 1 auto;
            min-width: 0;
            cursor: default;
            pointer-events: none;
            color: var(--text);
            font-size: 0.9em;
            font-weight: 400;
            word-break: break-word;
            line-height: 1.5;
            margin-right: 10px;
            text-align: left;
            transition: color 0.2s;
        }
        .label-en { display: block; font-size: 0.92em; font-weight: 500; color: var(--text); }
        .label-th { display: none;  font-size: 0.92em; font-weight: 500; color: var(--text); margin-top: 0; }
        /* lang=th: hide EN, show TH */
        body.lang-th .label-en { display: none; }
        body.lang-th .label-th { display: block; }
        /* lang=en (default): show EN, hide TH */
        body.lang-en .label-en { display: block; }
        body.lang-en .label-th { display: none; }
        .checklist-item input[type="checkbox"]:checked + label .label-en { text-decoration: line-through; color: var(--text-muted); }
        .checklist-item input[type="checkbox"]:checked + label .label-th { text-decoration: line-through; color: var(--text-muted); }

        /* Lang toggle button */
        .lang-toggle {
            display: flex;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            gap: 0;
        }
        .lang-toggle button {
            padding: 5px 12px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-size: 0.78em;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: background 0.15s, color 0.15s;
        }
        .lang-toggle button.active {
            background: var(--accent);
            color: white;
        }
        .lang-toggle button:not(.active):hover { background: var(--surface2); color: var(--text); }

        /* Checked item style */
        .checklist-item:has(input:checked) {
            background: var(--surface);
            border-color: var(--border);
        }

        .checklist-item .item-actions { flex: 0 0 auto; display: flex; gap: 5px; align-items: center; }

        .item-btn {
            padding: 5px 9px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78em;
            min-width: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s;
        }
        .item-btn:hover { background: var(--surface3); color: var(--accent2); border-color: var(--border-bright); }
        .item-btn.delete:hover { color: var(--red); border-color: var(--red); background: rgba(248,113,113,0.08); }

        .sortable-ghost { opacity: 0.3; background: var(--accent-glow); border: 1px dashed var(--accent); }

        /* ── Add item section ── */
        .add-item-section {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            padding: 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            align-items: stretch;
        }
        .add-item-inputs { flex: 1; display: flex; flex-direction: column; gap: 7px; }
        .add-item-section input {
            width: 100%;
            padding: 9px 13px;
            background: var(--surface3);
            border: 1px solid var(--border-bright);
            border-radius: 8px;
            font-size: 0.88em;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .add-item-section input::placeholder { color: var(--text-muted); }
        .add-item-section input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .add-item-section button {
            padding: 10px 16px;
            background: var(--green);
            color: #0a1a12;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85em;
            white-space: nowrap;
            transition: opacity 0.2s;
            align-self: stretch;
        }
        .add-item-section button:hover { opacity: 0.85; }

        /* ── Main action buttons ── */
        .actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
        button.main-action {
            flex: 1;
            min-width: 140px;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.01em;
        }
        .btn-copy {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px rgba(124,111,247,0.3);
        }
        .btn-copy:hover { background: var(--accent-dim); box-shadow: 0 4px 24px rgba(124,111,247,0.45); transform: translateY(-1px); }
        .btn-reset {
            background: var(--surface3);
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .btn-reset:hover { background: var(--surface2); color: var(--red); border-color: var(--red); }

        /* Uncheck All small button */
        .item-btn.uncheck-all-btn {
            padding: 7px 14px;
            font-size: 0.82em;
            color: var(--amber);
            border-color: rgba(251,191,36,0.3);
            background: rgba(251,191,36,0.06);
            min-width: auto;
        }
        .item-btn.uncheck-all-btn:hover { background: rgba(251,191,36,0.14); border-color: var(--amber); }

        /* ── Feedback toast ── */
        .copy-feedback {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface2);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 13px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 1000;
            animation: slideIn 0.3s cubic-bezier(.2,.8,.3,1);
            font-size: 0.9em;
            font-weight: 500;
        }
        .copy-feedback.show { display: block; }

        /* ── Edit modal ── */
        .edit-item-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .edit-item-modal.show { display: flex; }
        .edit-item-content {
            background: var(--surface2);
            border: 1px solid var(--border-bright);
            padding: 28px;
            border-radius: 14px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.8);
        }
        .edit-item-content h2 { margin-bottom: 18px; color: var(--text); font-size: 1em; font-weight: 600; letter-spacing: -0.01em; }
        .edit-field-group { margin-bottom: 14px; }
        .edit-field-group:last-of-type { margin-bottom: 20px; }
        .edit-field-label { display: block; font-size: 0.72em; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.06em; text-transform: uppercase; }
        .edit-item-content input {
            width: 100%;
            padding: 11px 13px;
            background: var(--surface3);
            border: 1px solid var(--border-bright);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9em;
            outline: none;
        }
        .edit-item-content input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .edit-item-actions { display: flex; gap: 10px; }
        .edit-item-actions button { flex: 1; padding: 11px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88em; transition: all 0.2s; }
        .edit-item-actions .save { background: var(--accent); color: white; }
        .edit-item-actions .save:hover { background: var(--accent-dim); }
        .edit-item-actions .cancel { background: var(--surface3); color: var(--text-dim); border: 1px solid var(--border); }
        .edit-item-actions .cancel:hover { color: var(--text); }

        @keyframes slideIn { from { transform: translateX(30px) scale(0.96); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }

        @media (max-width: 768px) {
            body { padding: 12px 10px; }
            .container { padding: 20px 16px; margin-top: 8px; }
            .checklist-item { padding: 11px 12px; }
            .add-item-section { flex-direction: column; }
            .add-item-section button { width: 100%; align-self: auto; }
            .actions { flex-direction: column; }
            button.main-action { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="trophy">⚽🇹🇭</div>
            <div class="editable-field" style="margin-bottom: 14px;">
                <span class="display-field" id="titleDisplay" onclick="editTitle()" style="font-size: 1.5em; font-weight: 700; color: var(--text); letter-spacing: -0.02em;">
                    <span data-lang="en">Thai League</span><span data-lang="th">ไทยลีก</span>
                </span>
                <input type="text" id="titleEnInput" style="display: none; font-size: 1em; text-align: center; width: 180px;" placeholder="🇬🇧 League name (EN)">
                <input type="text" id="titleThInput" style="display: none; font-size: 1em; text-align: center; width: 180px;" placeholder="🇹🇭 ชื่อลีก (TH)">
                <button id="titleBtn" style="display: none;" onclick="saveTitle()">Save</button>
            </div>
            <div class="match-info">
                <div class="editable-field">
                    <span class="display-field" id="teamDisplay" onclick="editTeams()">
                        <span data-lang="en">Chanthaburi vs Sisaket</span><span data-lang="th">จันทบุรี vs ศรีสะเกษ</span>
                    </span>
                    <input type="text" id="teamEnInput" style="display: none; width: 240px;" placeholder="🇬🇧 e.g. Chanthaburi vs Sisaket">
                    <input type="text" id="teamThInput" style="display: none; width: 240px;" placeholder="🇹🇭 เช่น จันทบุรี vs ศรีสะเกษ">
                    <button id="teamBtn" style="display: none;" onclick="saveTeams()">Save</button>
                </div>
                <div class="editable-field">
                    <span class="display-field" id="dateDisplay" onclick="editDate()">📅 29 November 2025</span>
                    <input type="date" id="dateInput" style="display: none;">
                    <button id="dateBtn" style="display: none;" onclick="saveDate()">Save</button>
                </div>
                <div class="editable-field">
                    <span class="display-field" id="timeDisplay" onclick="editTime()">⏰ Kickoff 18:30</span>
                    <input type="time" id="timeInput" style="display: none;">
                    <button id="timeBtn" style="display: none;" onclick="saveTime()">Save</button>
                </div>
                <div class="editable-field">
                    <span class="display-field" id="venueDisplay" onclick="editVenue()">
                        <span data-lang="en">🏟️ Venue: -</span><span data-lang="th">🏟️ สนาม: -</span>
                    </span>
                    <input type="text" id="venueEnInput" style="display: none; width: 220px;" placeholder="🇬🇧 e.g. PAT Stadium">
                    <input type="text" id="venueThInput" style="display: none; width: 220px;" placeholder="🇹🇭 เช่น สนาม PAT">
                    <button id="venueBtn" style="display: none;" onclick="saveVenue()">Save</button>
                </div>
            </div>
        </div>

        <div class="checklist">
            <div class="progress-section">
                <div class="progress-label">
                    <span>Status</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="section-title">📋 Check List
                <div class="lang-toggle" style="margin-left:auto;">
                    <button id="langEnBtn" onclick="setLang('en')">🇬🇧 EN</button>
                    <button id="langThBtn" onclick="setLang('th')">🇹🇭 TH</button>
                </div>
            </div>
            <div class="uncheck-row">
                <button class="item-btn uncheck-all-btn" onclick="uncheckAll()">✖ Uncheck All</button>
            </div>
            
            <div id="checklistContainer">
            </div>

            <div class="add-item-section">
                <div class="add-item-inputs">
                    <input type="text" id="newItemEnInput" placeholder="🇬🇧 English step...">
                    <input type="text" id="newItemThInput" placeholder="🇹🇭 ขั้นตอนภาษาไทย...">
                </div>
                <button onclick="addNewItem()">➕ Add</button>
            </div>
        </div>

        <div class="actions">
            <button class="main-action btn-copy" onclick="copyToClipboard()">📋 Copy Text</button>
            <button class="main-action btn-reset" onclick="resetChecklist()">🔄 Reset</button>
        </div>
    </div>

    <div class="copy-feedback" id="feedback">✓ Copied!</div>

    <div class="edit-item-modal" id="editModal">
        <div class="edit-item-content">
            <h2>Edit Item</h2>
            <div class="edit-field-group">
                <span class="edit-field-label">🇬🇧 English</span>
                <input type="text" id="editItemEnInput" placeholder="English text">
            </div>
            <div class="edit-field-group">
                <span class="edit-field-label">🇹🇭 ภาษาไทย</span>
                <input type="text" id="editItemThInput" placeholder="ข้อความภาษาไทย">
            </div>
            <div class="edit-item-actions">
                <button class="save" onclick="saveEditItem()">💾 Save</button>
                <button class="cancel" onclick="closeEditModal()">❌ Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // รายการหลัก (Default) - 2 ภาษา EN / TH
        const defaultItems = [
            {en: 'Camera signal to VOR',                                           th: 'สัญญาณภาพมาแล้ว'},
            {en: 'Camera Pan with OB at 02:00 PM',                                 th: 'นัดแพนกล้อง'},
            {en: 'Calibrates line to 16M and Goal line',                           th: 'ตีเส้น'},
            {en: 'Camera Pan finished',                                             th: 'แพนกล้องเรียบร้อย'},
            {en: 'Throw ball and Sync ball',                                        th: 'ทุ่มบอล, Sync ball'},
            {en: 'PGM check from OB 3 screen (OFR case)',                          th: 'เช็ค PGM จาก OB 3 จอ'},
            {en: 'Vokkero test',                                                    th: 'เทส Vokkero'},
            {en: 'Export file to sound test',                                       th: 'Export test sound'},
            {en: 'RRA check',                                                       th: 'เช็คจอ RRA ข้างสนาม'},
            {en: 'Referee field check 04:00 PM',                                   th: 'ผู้ตัดสินตรวจสนาม'},
            {en: 'Clear storage 05:00 PM',                                          th: 'Clear storage'},
            {en: 'Prepare offside case and ball kick 1,2,3 step for referee check',th: 'เตรียมวิดีโอให้ผู้ตัดสิน'},
            {en: 'Ready to kick-off',                                               th: 'พร้อมแข่ง'},
        ];

        const STORAGE_KEY_ITEMS = 'checklistItems_v4';
        const STORAGE_KEY_STATE = 'checklistState_v4';
        const STORAGE_KEY_MATCH = 'matchInfo_v4';

        // --- Safe Storage: localStorage + Cookie fallback ---
        const _mem = {};

        function _cookieSet(key, val) {
            try {
                const encoded = encodeURIComponent(val);
                if (encoded.length > 3800) return; // cookie hard limit ~4096 bytes incl. name+attrs
                const exp = new Date(Date.now() + 365 * 864e5).toUTCString();
                document.cookie = encodeURIComponent(key) + '=' + encoded + ';expires=' + exp + ';path=/;SameSite=Lax';
            } catch(e) {}
        }
        function _cookieGet(key) {
            try {
                const m = document.cookie.match('(?:^|; )' + encodeURIComponent(key) + '=([^;]*)');
                return m ? decodeURIComponent(m[1]) : null;
            } catch(e) { return null; }
        }
        function _cookieDel(key) {
            try { document.cookie = encodeURIComponent(key) + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/'; } catch(e) {}
        }
        function storageSet(key, val) {
            _mem[key] = val;
            try { localStorage.setItem(key, val); } catch(e) {}
            _cookieSet(key, val);
        }
        function storageGet(key) {
            try {
                const v = localStorage.getItem(key);
                if (v !== null) { _mem[key] = v; return v; }
            } catch(e) {}
            const c = _cookieGet(key);
            if (c !== null) {
                _mem[key] = c;
                try { localStorage.setItem(key, c); } catch(e) {}
                return c;
            }
            return _mem[key] || null;
        }
        function storageDel(key) {
            delete _mem[key];
            try { localStorage.removeItem(key); } catch(e) {}
            _cookieDel(key);
        }
        // --- End Storage Layer ---

        const STORAGE_KEY_LANG  = 'checklistLang_v1';

        let currentLang = 'en';
        let sortableInstance = null;

        function setLang(lang) {
            currentLang = lang;
            storageSet(STORAGE_KEY_LANG, lang);
            document.body.classList.toggle('lang-th', lang === 'th');
            document.body.classList.toggle('lang-en', lang === 'en');
            document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
            document.getElementById('langThBtn').classList.toggle('active', lang === 'th');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = storageGet(STORAGE_KEY_LANG) || 'en';
            initializeData();
            loadEditableFields();
            renderChecklist();
            initSortable();
            setLang(savedLang);
        });

        function initializeData() {
            const storedItems = JSON.parse(storageGet(STORAGE_KEY_ITEMS));
            const storedState = storageGet(STORAGE_KEY_STATE);
            
            // ถ้าไม่มี items ให้ใช้ default
            if (!storedItems || storedItems.length === 0) {
                storageSet(STORAGE_KEY_ITEMS, JSON.stringify(defaultItems));
            }
            
            // ถ้าไม่มี state ให้สร้างใหม่เป็น empty object
            if (!storedState) {
                storageSet(STORAGE_KEY_STATE, JSON.stringify({}));
            }
            
            loadChecklistState();
        }

        function initSortable() {
            const el = document.getElementById('checklistContainer');
            sortableInstance = new Sortable(el, {
                animation: 200,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    updateOrderAfterDrag();
                }
            });
        }

        function updateOrderAfterDrag() {
            const container = document.getElementById('checklistContainer');
            const itemElements = container.querySelectorAll('.checklist-item');
            const newItems = [];
            const newState = {};
            itemElements.forEach((el, index) => {
                const en = el.dataset.en;
                const th = el.dataset.th;
                const isChecked = el.querySelector('input[type="checkbox"]').checked;
                newItems.push({en, th});
                newState[`item${index}`] = isChecked;
            });
            saveChecklistItems(newItems);
            storageSet(STORAGE_KEY_STATE, JSON.stringify(newState));
            renderChecklist();
        }

        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';
            const items = getChecklistItems(); 
            items.forEach((item, index) => {
                const checked = getItemCheckedState(index);
                const itemElement = document.createElement('div');
                itemElement.className = 'checklist-item';
                itemElement.dataset.en = item.en;
                itemElement.dataset.th = item.th || '';
                itemElement.innerHTML = `
                    <div class="drag-handle">⋮⋮</div>
                    <input type="checkbox" id="item${index}" ${checked ? 'checked' : ''} onchange="saveChecklistState(); updateProgress();">
                    <label for="item${index}">
                        <span class="label-en">${item.en}</span>
                        ${item.th ? `<span class="label-th">${item.th}</span>` : ''}
                    </label>
                    <div class="item-actions">
                        <button class="item-btn" onclick="openEditModal(${index})">✏️</button>
                        <button class="item-btn delete" onclick="deleteItem(${index})">🗑️</button>
                    </div>
                `;
                container.appendChild(itemElement);
            });
            updateProgress();
        }

        function getChecklistItems() {
            const items = JSON.parse(storageGet(STORAGE_KEY_ITEMS));
            return (items && items.length > 0) ? items : defaultItems;
        }
        function saveChecklistItems(items) { storageSet(STORAGE_KEY_ITEMS, JSON.stringify(items)); }
        function getItemCheckedState(index) { const state = JSON.parse(storageGet(STORAGE_KEY_STATE)) || {}; return state[`item${index}`] || false; }
        function saveChecklistState() {
            const items = getChecklistItems();
            const state = {};
            items.forEach((item, index) => {
                const checkbox = document.getElementById(`item${index}`);
                if (checkbox) state[`item${index}`] = checkbox.checked;
            });
            storageSet(STORAGE_KEY_STATE, JSON.stringify(state));
        }
        function loadChecklistState() { 
            const state = JSON.parse(storageGet(STORAGE_KEY_STATE));
            return state || {};
        }

        /* --- ส่วนจัดการข้อมูลทีม วันที่ เวลา --- */
        function saveEditableFields() {
            const data = {
                titleEn: document.querySelector('#titleDisplay [data-lang="en"]').textContent,
                titleTh: document.querySelector('#titleDisplay [data-lang="th"]').textContent,
                teamsEn: document.querySelector('#teamDisplay [data-lang="en"]').textContent,
                teamsTh: document.querySelector('#teamDisplay [data-lang="th"]').textContent,
                date: document.getElementById('dateDisplay').textContent,
                time: document.getElementById('timeDisplay').textContent,
                venueEn: document.querySelector('#venueDisplay [data-lang="en"]').textContent,
                venueTh: document.querySelector('#venueDisplay [data-lang="th"]').textContent,
            };
            storageSet(STORAGE_KEY_MATCH, JSON.stringify(data));
        }
        function loadEditableFields() {
            const data = JSON.parse(storageGet(STORAGE_KEY_MATCH));
            if (data) {
                if (data.titleEn) document.querySelector('#titleDisplay [data-lang="en"]').textContent = data.titleEn;
                if (data.titleTh) document.querySelector('#titleDisplay [data-lang="th"]').textContent = data.titleTh;
                if (data.teamsEn) document.querySelector('#teamDisplay [data-lang="en"]').textContent = data.teamsEn;
                if (data.teamsTh) document.querySelector('#teamDisplay [data-lang="th"]').textContent = data.teamsTh;
                if (data.date) document.getElementById('dateDisplay').textContent = data.date;
                if (data.time) document.getElementById('timeDisplay').textContent = data.time;
                if (data.venueEn) document.querySelector('#venueDisplay [data-lang="en"]').textContent = data.venueEn;
                if (data.venueTh) document.querySelector('#venueDisplay [data-lang="th"]').textContent = data.venueTh;
            }
        }
        function toggleBilingualField(id, showInput = true) {
            const display = document.getElementById(id + 'Display');
            const enInput = document.getElementById(id + 'EnInput');
            const thInput = document.getElementById(id + 'ThInput');
            const btn = document.getElementById(id + 'Btn');
            if (showInput) {
                display.style.display = 'none';
                enInput.style.display = 'inline-block';
                thInput.style.display = 'inline-block';
                btn.style.display = 'inline-block';
                enInput.focus();
            } else {
                display.style.display = '';
                enInput.style.display = 'none';
                thInput.style.display = 'none';
                btn.style.display = 'none';
            }
        }
        function editTitle() {
            document.getElementById('titleEnInput').value = document.querySelector('#titleDisplay [data-lang="en"]').textContent;
            document.getElementById('titleThInput').value = document.querySelector('#titleDisplay [data-lang="th"]').textContent;
            toggleBilingualField('title');
        }
        function saveTitle() {
            const en = document.getElementById('titleEnInput').value.trim() || 'Thai League';
            const th = document.getElementById('titleThInput').value.trim() || 'ไทยลีก';
            document.querySelector('#titleDisplay [data-lang="en"]').textContent = en;
            document.querySelector('#titleDisplay [data-lang="th"]').textContent = th;
            toggleBilingualField('title', false);
            saveEditableFields();
        }
        function editVenue() {
            const enFull = document.querySelector('#venueDisplay [data-lang="en"]').textContent.replace('🏟️ Venue: ', '');
            const thFull = document.querySelector('#venueDisplay [data-lang="th"]').textContent.replace('🏟️ สนาม: ', '');
            document.getElementById('venueEnInput').value = enFull === '-' ? '' : enFull;
            document.getElementById('venueThInput').value = thFull === '-' ? '' : thFull;
            toggleBilingualField('venue');
        }
        function saveVenue() {
            const en = document.getElementById('venueEnInput').value.trim() || '-';
            const th = document.getElementById('venueThInput').value.trim() || en;
            document.querySelector('#venueDisplay [data-lang="en"]').textContent = '🏟️ Venue: ' + en;
            document.querySelector('#venueDisplay [data-lang="th"]').textContent = '🏟️ สนาม: ' + th;
            toggleBilingualField('venue', false);
            saveEditableFields();
        }
        function editTeams() {
            document.getElementById('teamEnInput').value = document.querySelector('#teamDisplay [data-lang="en"]').textContent;
            document.getElementById('teamThInput').value = document.querySelector('#teamDisplay [data-lang="th"]').textContent;
            toggleBilingualField('team');
        }
        function saveTeams() {
            const en = document.getElementById('teamEnInput').value.trim() || 'Chanthaburi vs Sisaket';
            const th = document.getElementById('teamThInput').value.trim() || en;
            document.querySelector('#teamDisplay [data-lang="en"]').textContent = en;
            document.querySelector('#teamDisplay [data-lang="th"]').textContent = th;
            toggleBilingualField('team', false);
            saveEditableFields();
        }
        function editDate() { 
            const display = document.getElementById('dateDisplay');
            const input = document.getElementById('dateInput');
            const currentText = display.textContent.replace('📅 ', '');
            const dateObj = new Date(currentText);
            if(!isNaN(dateObj)) input.value = dateObj.toISOString().split('T')[0];
            toggleField('date'); 
        }
        function saveDate() { 
            const val = document.getElementById('dateInput').value;
            if(val) {
                 const d = new Date(val);
                 saveField('date', '📅 ' + d.toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}));
            } else { toggleField('date', false); }
        }
        function editTime() { 
             const display = document.getElementById('timeDisplay');
             const input = document.getElementById('timeInput');
             input.value = display.textContent.replace('⏰ Kickoff ', '');
             toggleField('time'); 
        }
        function saveTime() { 
            const val = document.getElementById('timeInput').value;
            if(val) saveField('time', '⏰ Kickoff ' + val);
            else toggleField('time', false);
        }
        function toggleField(id, showInput = true) {
            const display = document.getElementById(id + 'Display');
            const input = document.getElementById(id + 'Input');
            const btn = document.getElementById(id + 'Btn');
            if (showInput) {
                display.style.display = 'none';
                input.style.display = 'inline-block';
                btn.style.display = 'inline-block';
                input.focus();
            } else {
                display.style.display = 'inline-block';
                input.style.display = 'none';
                btn.style.display = 'none';
            }
        }
        function saveField(id, newVal) {
            const display = document.getElementById(id + 'Display');
            display.textContent = newVal;
            toggleField(id, false);
            saveEditableFields();
        }

        /* --- ส่วน Copy และ Reset --- */
        function copyToClipboard() {
            const lang = currentLang;
            const title = document.querySelector(`#titleDisplay [data-lang="${lang}"]`)?.textContent || document.querySelector('#titleDisplay [data-lang="en"]').textContent;
            const teams = document.querySelector(`#teamDisplay [data-lang="${lang}"]`)?.textContent || document.querySelector('#teamDisplay [data-lang="en"]').textContent;
            const venue = document.querySelector(`#venueDisplay [data-lang="${lang}"]`)?.textContent || document.querySelector('#venueDisplay [data-lang="en"]').textContent;
            const date = document.getElementById('dateDisplay').textContent;
            const time = document.getElementById('timeDisplay').textContent;
            const percent = document.getElementById('progressPercent').textContent;
            
            const checkedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const totalCount = document.querySelectorAll('input[type="checkbox"]').length;
            const filledLength = Math.round((checkedCount / totalCount) * 10) || 0;
            const progressBar = '█'.repeat(filledLength) + '░'.repeat(10 - filledLength);

            let text = `⚽🇹🇭 ${title}\n${teams}\n${date}\n${time}\n${venue}\n\n📋 Check List\nStatus: [${progressBar}] ${percent}\n\n`;
            
            getChecklistItems().forEach((item, index) => {
                const cb = document.getElementById(`item${index}`);
                const label = (currentLang === 'th' && item.th) ? item.th : item.en;
                text += `${cb && cb.checked ? '✅' : '⬜'} ${label}\n`;
            });

            navigator.clipboard.writeText(text).then(() => {
                const fb = document.getElementById('feedback');
                fb.classList.add('show');
                setTimeout(() => fb.classList.remove('show'), 2000);
            });
        }

        function updateProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const total = checkboxes.length;
            const pct = total === 0 ? 0 : Math.round((checked / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPercent').textContent = pct + '%';
        }

        function uncheckAll() {
            if(confirm('Uncheck all items?')) {
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(cb => cb.checked = false);
                saveChecklistState();
                updateProgress();
            }
        }
        function resetChecklist() {
            if(confirm('Reset all checks? (Items will return to default)')) {
                storageSet(STORAGE_KEY_ITEMS, JSON.stringify(defaultItems));
                storageSet(STORAGE_KEY_STATE, JSON.stringify({}));
                initializeData();
                renderChecklist();
            }
        }

        /* --- ส่วนจัดการ Item (เพิ่ม/ลบ/แก้ไข) --- */
        function addNewItem() {
            const enInput = document.getElementById('newItemEnInput');
            const thInput = document.getElementById('newItemThInput');
            const en = enInput.value.trim();
            const th = thInput.value.trim();
            if(!en) return;
            const items = getChecklistItems();
            items.push({en, th});
            saveChecklistItems(items);
            enInput.value = '';
            thInput.value = '';
            renderChecklist();
        }

        function deleteItem(index) {
            if(confirm('Delete this item?')) {
                let items = getChecklistItems();
                const state = loadChecklistState();
                items.splice(index, 1);
                if (items.length === 0) { items = [...defaultItems]; }
                saveChecklistItems(items);
                // Rebuild state with correct indices after deletion
                const newState = {};
                Object.keys(state).forEach(key => {
                    const oldIndex = parseInt(key.replace('item', ''));
                    if (oldIndex < index) {
                        newState[`item${oldIndex}`] = state[key];
                    } else if (oldIndex > index) {
                        newState[`item${oldIndex - 1}`] = state[key];
                    }
                });
                storageSet(STORAGE_KEY_STATE, JSON.stringify(newState));
                renderChecklist();
            }
        }

        function openEditModal(index) {
            currentEditIndex = index;
            const item = getChecklistItems()[index];
            document.getElementById('editItemEnInput').value = item.en;
            document.getElementById('editItemThInput').value = item.th || '';
            document.getElementById('editModal').classList.add('show');
            document.getElementById('editItemEnInput').focus();
        }
        function closeEditModal() { document.getElementById('editModal').classList.remove('show'); currentEditIndex = null; }
        function saveEditItem() {
            if(currentEditIndex === null) return;
            const en = document.getElementById('editItemEnInput').value.trim();
            const th = document.getElementById('editItemThInput').value.trim();
            if(en) {
                const items = getChecklistItems();
                items[currentEditIndex] = {en, th};
                saveChecklistItems(items);
                renderChecklist();
                closeEditModal();
            }
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if(document.activeElement.id === 'newItemEnInput') addNewItem();
                if(document.activeElement.id === 'newItemThInput') addNewItem();
                if(document.activeElement.id === 'editItemEnInput') saveEditItem();
                if(document.activeElement.id === 'editItemThInput') saveEditItem();
                if(document.activeElement.id === 'teamEnInput') saveTeams();
                if(document.activeElement.id === 'teamThInput') saveTeams();
                if(document.activeElement.id === 'venueEnInput') saveVenue();
                if(document.activeElement.id === 'venueThInput') saveVenue();
                if(document.activeElement.id === 'titleEnInput') saveTitle();
                if(document.activeElement.id === 'titleThInput') saveTitle();
            }
        });
        // ปิด modal เฉพาะเมื่อ mousedown และ mouseup อยู่บน backdrop เท่านั้น
        // ป้องกันการปิดตอนลาก select text แล้วเม้าออกนอก input
        let _modalMousedownOnBackdrop = false;
        const _editModal = document.getElementById('editModal');
        _editModal.addEventListener('mousedown', e => {
            _modalMousedownOnBackdrop = (e.target.id === 'editModal');
        });
        _editModal.addEventListener('mouseup', e => {
            if(_modalMousedownOnBackdrop && e.target.id === 'editModal') closeEditModal();
            _modalMousedownOnBackdrop = false;
        });
    </script>
</body>
</html>
